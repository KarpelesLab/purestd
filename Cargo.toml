[package]
name = "purestd"
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
description = "A pure-Rust standard library replacement that talks to the kernel via raw syscalls only — no libc."
repository = "https://github.com/KarpelesLab/purestd"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no_std", "std", "libc-free", "syscall", "freestanding"]
categories = ["no-std", "os::unix-apis"]

[lib]
# no_std library; built without the platform std/libc.

[dependencies]
# No third-party dependencies — purestd implements its own everything
# (hash map, hasher, …) on top of core + alloc only.

[features]
# `rt` provides the std-level policy symbols: the `#[panic_handler]`, the
# `#[global_allocator]` static, and the `lang_start`-equivalent runtime glue
# (`__purestd_start`). On by default (like a real std). Turn it off
# (`default-features = false`) when a host runtime supplies those instead.
#
# The process entry point (`_start`) and the mem*/unwind/getauxval symbols are
# NOT part of purestd at all — in a real build those come from crt0 /
# compiler_builtins / the unwinder, which here is fullrust's job. (The examples
# link a tiny test-only stand-in for them; see examples/common/rt.rs.)
default = ["rt"]
rt = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "stdshow"
path = "examples/stdshow.rs"
