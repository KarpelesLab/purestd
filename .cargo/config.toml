# purestd is `#![no_std]`, so rustc links it freestanding (`-nodefaultlibs`) by
# default. For ordinary testing we want a normal build where the C runtime
# provides the entry point (`_start`/crt0) and `memcpy`/etc. (libc) — purestd
# itself still does all its work through raw syscalls. `default-linker-libraries`
# re-enables that normal libc link.
#
# This is just how the *examples* are built for the dev loop and CI. A libc-free,
# fully-static build is the fullrust toolchain's job, not this config's.

[target.aarch64-apple-darwin]
rustflags = ["-Cdefault-linker-libraries=yes"]

[target.x86_64-apple-darwin]
rustflags = ["-Cdefault-linker-libraries=yes"]

# wasm32-WASI: link the wasi-libc startup (crt1) + libc so the `_start` /
# `__main_argc_argv` / TLS-init (`__wasi_init_tp`) symbols resolve. purestd still
# does all its own work through WASI imports; it just links the crt.
[target.wasm32-wasip1]
rustflags = ["-Cdefault-linker-libraries=yes"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Cdefault-linker-libraries=yes"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Cdefault-linker-libraries=yes"]

# Cross targets exercised in CI under qemu-user. The cross gcc supplies crt0 and
# the target sysroot; `-Cdefault-linker-libraries` links libc the same way the
# native dev builds do (purestd still calls zero libc itself).
[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"
rustflags = ["-Cdefault-linker-libraries=yes"]

[target.i686-unknown-linux-gnu]
linker = "i686-linux-gnu-gcc"
rustflags = ["-Cdefault-linker-libraries=yes"]

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = ["-Cdefault-linker-libraries=yes"]
