name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# purestd is just a `no_std` library. Here we build and run its examples the
# ordinary way — a normal Rust build where libc provides the C runtime — on
# macOS arm64, Linux x86_64, and Linux aarch64. (The libc-free, fully-static
# build is the fullrust toolchain's job, exercised in that repo.)
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup default stable && rustc -V
      - name: Build (lib, default + no-default-features)
        run: |
          cargo build
          cargo build --no-default-features
      - name: Build examples
        run: cargo build --examples
      - name: Run & validate
        shell: bash
        run: |
          set -eo pipefail
          B=target/debug/examples
          # Capture output (don't pipe to grep -q: it short-circuits and SIGPIPEs
          # the producer, which pipefail then flags).
          check() { local pat="$1"; shift; local out; out="$("$@")"; echo "$out"; grep -q "$pat" <<<"$out"; }
          check "hello from purestd"      "$B/hello"
          check "\[3\] c"                 "$B/args" a b c
          check "^ok$"                    "$B/stdshow"
          check "checks passed"           "$B/mapstress"
          check "reference vectors match" "$B/sipcheck"
          check "counter = 80000"         "$B/threads"
          check "net: OK"                 "$B/net"
          check "io_test: OK"             "$B/io_test"
          check "synctest: OK"            "$B/synctest"
          check "fstest: OK"              "$B/fstest"
          check "proctest: OK"            "$B/proctest"
          check "misc_test: OK"           "$B/misc_test"
          check "tlstest: OK"             "$B/tlstest"
          check "scopetest: OK"           "$B/scopetest"

  # Cross targets that have no native GitHub runner: cross-build with the gcc
  # cross toolchain and *run* the same example corpus under qemu-user, so the
  # per-arch syscall numbers, struct offsets, clone trampoline and futex are all
  # genuinely exercised — not merely type-checked.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: riscv64gc-unknown-linux-gnu
            apt: gcc-riscv64-linux-gnu
            qemu: qemu-riscv64
            sysroot: /usr/riscv64-linux-gnu
          - triple: i686-unknown-linux-gnu
            apt: gcc-i686-linux-gnu
            qemu: qemu-i386
            sysroot: /usr/i686-linux-gnu
          - triple: arm-unknown-linux-gnueabihf
            apt: gcc-arm-linux-gnueabihf
            qemu: qemu-arm
            sysroot: /usr/arm-linux-gnueabihf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Cross toolchain + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }} qemu-user qemu-user-static
      - name: Toolchain
        run: |
          rustup default stable
          rustup target add ${{ matrix.triple }}
          rustc -V
      - name: Build (lib, default + no-default-features)
        run: |
          cargo build --target ${{ matrix.triple }}
          cargo build --target ${{ matrix.triple }} --no-default-features
      - name: Build examples
        run: cargo build --target ${{ matrix.triple }} --examples
      - name: Run & validate (qemu)
        shell: bash
        run: |
          set -eo pipefail
          B=target/${{ matrix.triple }}/debug/examples
          Q="${{ matrix.qemu }} -L ${{ matrix.sysroot }}"
          check() { local pat="$1"; shift; local out; out="$($Q "$@")"; echo "$out"; grep -q "$pat" <<<"$out"; }
          check "hello from purestd"      "$B/hello"
          check "\[3\] c"                 "$B/args" a b c
          check "^ok$"                    "$B/stdshow"
          check "checks passed"           "$B/mapstress"
          check "reference vectors match" "$B/sipcheck"
          check "counter = 80000"         "$B/threads"
          check "net: OK"                 "$B/net"
          check "io_test: OK"             "$B/io_test"
          check "synctest: OK"            "$B/synctest"
          check "fstest: OK"              "$B/fstest"
          check "proctest: OK"            "$B/proctest"
          check "misc_test: OK"           "$B/misc_test"
          check "tlstest: OK"             "$B/tlstest"
          check "scopetest: OK"           "$B/scopetest"

  # macOS x86_64 has no GitHub runner (Intel macOS is retired) and can't be
  # emulated like the Linux cross targets, so it is BUILD-ONLY: we cross-build
  # the lib + examples from the arm64 runner. Runtime behavior (carry-flag error
  # capture, fork/pipe, stat layout) must be confirmed on real Intel hardware;
  # thread spawning is intentionally Unsupported on this backend for now.
  build-macos-x86_64:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          rustup default stable
          rustup target add x86_64-apple-darwin
          rustc -V
      - name: Build (lib default + no-default-features, and examples)
        run: |
          cargo build --target x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin --no-default-features
          cargo build --target x86_64-apple-darwin --examples

  # wasm32-WASI: WebAssembly has no syscalls, so this backend is reduced — stdio,
  # args/env, clocks, random, and the heap (linear-memory growth) work; threads,
  # processes, sockets and the filesystem report Unsupported. All examples build;
  # we run the supported subset under wasmtime.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          rustup default stable
          rustup target add wasm32-wasip1
          rustc -V
      - name: Build (lib default + no-default-features, and all examples)
        run: |
          cargo build --target wasm32-wasip1
          cargo build --target wasm32-wasip1 --no-default-features
          cargo build --target wasm32-wasip1 --examples
      - name: Run & validate (wasmtime, supported subset)
        shell: bash
        run: |
          set -eo pipefail
          B=target/wasm32-wasip1/debug/examples
          check() { local pat="$1"; shift; local out; out="$(wasmtime run "$@")"; echo "$out"; grep -q "$pat" <<<"$out"; }
          check "hello from purestd"      "$B/hello.wasm"
          check "\[3\] c"                 "$B/args.wasm" a b c
          check "checks passed"           "$B/mapstress.wasm"
          check "reference vectors match" "$B/sipcheck.wasm"
