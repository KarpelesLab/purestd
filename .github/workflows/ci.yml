name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# purestd is just a `no_std` library. Here we build and run its examples the
# ordinary way — a normal Rust build where libc provides the C runtime — on
# macOS arm64, Linux x86_64, and Linux aarch64. (The libc-free, fully-static
# build is the fullrust toolchain's job, exercised in that repo.)
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup default stable && rustc -V
      - name: Build (lib, default + no-default-features)
        run: |
          cargo build
          cargo build --no-default-features
      - name: Build examples
        run: cargo build --examples
      - name: Run & validate
        shell: bash
        run: |
          set -eo pipefail
          B=target/debug/examples
          # Capture output (don't pipe to grep -q: it short-circuits and SIGPIPEs
          # the producer, which pipefail then flags).
          check() { local pat="$1"; shift; local out; out="$("$@")"; echo "$out"; grep -q "$pat" <<<"$out"; }
          check "hello from purestd"      "$B/hello"
          check "\[3\] c"                 "$B/args" a b c
          check "^ok$"                    "$B/stdshow"
          check "checks passed"           "$B/mapstress"
          check "reference vectors match" "$B/sipcheck"
          check "counter = 80000"         "$B/threads"
          check "net: OK"                 "$B/net"
          check "io_test: OK"             "$B/io_test"
          check "synctest: OK"            "$B/synctest"
          check "fstest: OK"              "$B/fstest"
          check "proctest: OK"            "$B/proctest"
          check "misc_test: OK"           "$B/misc_test"
          check "tlstest: OK"             "$B/tlstest"
