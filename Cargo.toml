[package]
name = "purestd"
version = "0.0.1"
edition = "2021"
description = "A pure-Rust standard library replacement that talks to the kernel via raw syscalls only — no libc."
license = "MIT OR Apache-2.0"

[lib]
# no_std library; built without the platform std/libc.

[dependencies]
# No third-party dependencies — purestd implements its own everything
# (hash map, hasher, …) on top of core + alloc only.

[dev-dependencies]
# The freestanding runtime (process entry + mem*/unwind intrinsics) that the
# example binaries link alongside purestd. Not a dependency of the library
# itself — purestd is only the std.
purert = { path = "crt" }

[features]
# `rt` provides the std-level policy symbols: the `#[panic_handler]`, the
# `#[global_allocator]` static, and the `lang_start`-equivalent runtime glue.
# On by default (like a real std). Turn it off (`default-features = false`) when
# a host runtime supplies those instead. The process entry point and the
# mem*/unwind intrinsics are NOT here — they live in the `purert` crate.
default = ["rt"]
rt = []

[workspace]
members = ["crt"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "stdshow"
path = "examples/stdshow.rs"
